<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TikTok Connected — The AI Dream Nest</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
           max-width: 560px; margin: 70px auto; padding: 0 20px; line-height: 1.6;
           color: #1a1a1a; text-align: center; }
    h1 { font-size: 1.6rem; }
    .ok { color: #128a3b; font-weight: 600; }
    .err { color: #c0392b; font-weight: 600; }
    .code { margin-top: 1.2rem; word-break: break-all; background: #f2f2f2;
            padding: .8rem 1rem; border-radius: 8px; font-family: ui-monospace, monospace;
            font-size: .95rem; }
    button { margin-top: 1rem; padding: .6rem 1.1rem; cursor: pointer; border: 1px solid #ccc;
             border-radius: 8px; background: #fff; }
  </style>
</head>
<body>
  <h1>The AI Dream Nest</h1>
  <p id="msg">Processing authorization…</p>
  <div id="codebox" class="code" hidden></div>
  <button id="copy" hidden>Copy code</button>

  <script>
    const q = new URLSearchParams(window.location.search);
    const code  = q.get("code");
    const state = q.get("state");
    const error = q.get("error");
    const saved = sessionStorage.getItem("tt_state");
    const msg = document.getElementById("msg");
    const box = document.getElementById("codebox");
    const copy = document.getElementById("copy");

    if (error) {
      msg.className = "err";
      msg.textContent = "Authorization failed: " + error;
    } else if (!code) {
      msg.className = "err";
      msg.textContent = "No authorization code returned.";
    } else if (saved && state && saved !== state) {
      msg.className = "err";
      msg.textContent = "State mismatch — please try logging in again.";
    } else {
      msg.className = "ok";
      msg.textContent = "✓ TikTok account connected successfully.";
      box.hidden = false;
      box.textContent = code;
      copy.hidden = false;
      copy.addEventListener("click", () => {
        navigator.clipboard.writeText(code).then(() => copy.textContent = "Copied!");
      });
    }
  </script>
</body>
</html>
