<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect TikTok — The AI Dream Nest</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
           max-width: 560px; margin: 70px auto; padding: 0 20px; line-height: 1.6;
           color: #1a1a1a; text-align: center; }
    h1 { font-size: 1.8rem; }
    p.tag { color: #666; }
    button { margin-top: 1.5rem; padding: .9rem 1.6rem; font-size: 1rem; cursor: pointer;
             background: #000; color: #fff; border: none; border-radius: 10px; }
    button:hover { background: #222; }
    .scopes { margin-top: 2rem; color: #666; font-size: .9rem; }
    code { background: #f2f2f2; padding: .1rem .35rem; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>The AI Dream Nest</h1>
  <p class="tag">Connect your TikTok account to publish original interior-design videos.</p>

  <button id="login">Log in with TikTok</button>

  <p class="scopes">
    This will request: <code>user.info.basic</code> and <code>video.publish</code>.
  </p>

  <script>
    // ---- fill in your app's Client Key (safe to expose; the secret is NOT here) ----
    const CLIENT_KEY   = "awa7fqci2r02s8ww";
    const REDIRECT_URI = "https://theaidreamnest.github.io/callback.html";
    const SCOPES       = "user.info.basic,video.publish";

    document.getElementById("login").addEventListener("click", () => {
      // random state to protect against CSRF; verified on the callback page
      const state = Math.random().toString(36).slice(2) + Date.now().toString(36);
      sessionStorage.setItem("tt_state", state);
      const url = "https://www.tiktok.com/v2/auth/authorize/"
        + "?client_key="  + encodeURIComponent(CLIENT_KEY)
        + "&scope="       + encodeURIComponent(SCOPES)
        + "&response_type=code"
        + "&redirect_uri=" + encodeURIComponent(REDIRECT_URI)
        + "&state="       + encodeURIComponent(state);
      window.location.href = url;
    });
  </script>
</body>
</html>
